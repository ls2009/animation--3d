# Fly.io config for the Sinaa Motion Lab API.
# Deploy from the REPO ROOT:  fly deploy --config apps/api/fly.toml
# First time:                 fly launch --no-deploy --copy-config --name <your-app>
app = "sinaa-motion-lab-api"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"
  # Build context is the repo root (set by deploying from the repo root).

[env]
  PIPELINE = "single"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  # Generations run as in-process background tasks: never scale to zero and
  # keep one machine, or running generations die mid-flight.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"   # chromium keyframe rendering needs headroom
